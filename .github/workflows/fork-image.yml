name: Fork receiver CI and GHCR

on:
  push:
    branches: [development, build/telemetry-ghcr]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: fork-receiver-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compile:
    name: Compile (${{ matrix.protocol }}, metadata ${{ matrix.metadata }})
    if: github.repository == 'leonroy/shairport-sync'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        protocol: [classic, airplay2]
        metadata: ['on', 'off']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf automake build-essential libtool pkg-config libpopt-dev libconfig-dev libavahi-client-dev libssl-dev libsoxr-dev libplist-dev libsodium-dev libgcrypt-dev uuid-dev libavutil-dev libavcodec-dev libavformat-dev libswresample-dev xxd libplist-utils
      - name: Compile and run meter tests
        env:
          PROTOCOL: ${{ matrix.protocol }}
          METADATA: ${{ matrix.metadata }}
        run: |
          autoreconf -i
          mkdir -p build-ci
          cd build-ci
          protocol_flag=--without-airplay-2
          if [ "$PROTOCOL" = airplay2 ]; then protocol_flag=--with-airplay-2; fi
          metadata_flags=(--without-metadata --without-metadata-pipe)
          if [ "$METADATA" = on ]; then metadata_flags=(--with-metadata --with-metadata-pipe); fi
          ../configure --sysconfdir=/etc --with-avahi --with-ssl=openssl --with-soxr --with-dummy --with-pipe --with-stdout "$protocol_flag" "${metadata_flags[@]}"
          make -j2
          make check
          ./shairport-sync -V
      - name: Test publishing rules
        run: python3 -m unittest discover -s .github/scripts -p test_fork_publish.py -v

  image:
    name: Receiver image (${{ matrix.arch }})
    if: github.repository == 'leonroy/shairport-sync'
    needs: compile
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runtime image and run architecture meter tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: shairport-sync:ci-${{ matrix.arch }}
          build-args: NQPTP_BRANCH=development
          labels: |
            org.opencontainers.image.source=https://github.com/leonroy/shairport-sync
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=5.6-dev
          cache-from: type=gha,scope=fork-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=fork-${{ matrix.arch }}
          provenance: false
      - name: Smoke-test runtime and both receiver modes
        run: python3 .github/scripts/smoke_receiver.py shairport-sync:ci-${{ matrix.arch }} linux/${{ matrix.arch }}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested architecture image
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ghcr.io/leonroy/shairport-sync:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          build-args: NQPTP_BRANCH=development
          labels: |
            org.opencontainers.image.source=https://github.com/leonroy/shairport-sync
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=5.6-dev
          cache-from: type=gha,scope=fork-${{ matrix.arch }}
          provenance: false

  publish:
    name: Publish tested receiver manifest
    if: github.repository == 'leonroy/shairport-sync' && github.event_name == 'push'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit image and promote current development
        run: python3 .github/scripts/fork_publish.py
